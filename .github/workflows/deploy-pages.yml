name: Deploy Gigaprint to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Supabase publishable keys are intended for browser applications.
          # Never place the database password or a service_role key here.
          VITE_SUPABASE_URL: https://ihifnhibzlgxotywbeji.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable__p2-4-2UkG8pb4x92O3dPg_SRFUnXRf
          VITE_SITE_URL: https://gigaprint-ec.github.io/gigaprint-webpage/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
